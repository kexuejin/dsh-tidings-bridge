/* ── base.css（基础变量：字体栈、圆角阶、缓动） ── */
/* Base variables referenced by the token sheets and component CSS but defined
 * upstream (deepsuite theme/global.css) — supplied here so the composite
 * --dsw-font-* variables resolve and motion rides the upstream curve. Code
 * font stack deliberately omits a bare `monospace` tail (Windows CJK falls
 * back to SimSun otherwise). */
:root {
  --dsw-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --dsw-font-family-brand: 'Montserrat', var(--dsw-font-family);
  --ds-font-family-code: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas,
    'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';
  --ds-ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ds-transition-duration: 0.2s;
  --ds-transition-duration-fast: 0.1s;
  --ds-transition-duration-slow: 0.3s;
  --dsw-radius-xs: 4px;
  --dsw-radius-sm: 8px;
  --dsw-radius-md: 12px;
  --dsw-radius-lg: 16px;
  --dsw-radius-xl: 20px;
  --dsw-radius-panel: 28px;
}

.win {
  --dsw-alias-settings-card-fill: var(--dsw-alias-bg-layer-2);
  --dsw-alias-settings-card-stroke: var(--dsw-alias-border-l4);
}

[data-dsh-automatic-focus]:focus,
[data-dsh-automatic-focus]:focus:focus-visible {
  outline: none;
}

/* ── focus.css（焦点环宽度与颜色） ── */
/* Components own offsets; dense tables and toolbars may keep a 1px ring. */
:root {
  --dsw-focus-ring-width: 2px;
}

/* The fallback names the colour and the standard width, never the style: a control that
 * disables its outline keeps `none` and paints nothing. Without the width, Chromium's
 * unnamed ring stayed at `auto 1px` while every declared ring used the standard geometry.
 * Declared rings also read this color, including rings on descendants and pseudo-elements. */
:focus-visible {
  outline-color: var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));
  outline-width: var(--dsw-focus-ring-width);
}

/* ui-primitives/input-modality publishes the attribute. Editable controls keep
 * their focus feedback on click; other controls reveal rings on keyboard
 * navigation. Only ring paint is suppressed, not elevation or selected borders. */
html[data-input-modality='pointer'] .win :focus-visible:not(:read-write) {
  --dsw-focus-ring-color: transparent;
  outline-color: transparent;
}

/* ══════════════════════════════════════════════════════════════════════════
   1. 稿子自己的骨架（不是设计的一部分，只是把窗口摆出来）
   ══════════════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--dsw-font-family);
  background: #8a8f98;   /* 舞台底色，只在画廊模式露出来；窗口内部才是真界面 */
  color: #1b1b1c;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }

/* ---- 顶部控制条（bare=1 时整条不渲染） ---- */
.ctl {
  position: sticky; top: 0; z-index: 50;
  background: #16181d; color: #e9ebef;
  border-bottom: 1px solid #2b2f38;
  padding: 10px 14px; display: grid; gap: 8px;
  font-size: 13px;
}
.ctlrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctlrow > b { width: 40px; font-weight: 600; color: #a4acb9; font-size: 12px; }
.ctlchip {
  border: 1px solid #3a3f4a; border-radius: 999px;
  padding: 3px 11px; font-size: 12px; line-height: 18px; color: #a4acb9;
}
.ctlchip.on { background: #2b2f38; border-color: #5a6170; color: #f7f8fa; }
.ctlhint { color: #7b8492; font-size: 12px; }

/* ---- 画廊 ---- */
.gallery { padding: 20px; display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
.gcell { margin: 0; display: grid; gap: 7px; }
.gwin { overflow: hidden; border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.3); position: relative; }
.gsc { transform-origin: top left; }
.gcell figcaption { font-size: 12px; line-height: 17px; color: #f2f4f7; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.gcell figcaption i { display: block; font-style: normal; color: #c8ccd3; font-size: 11px; }

/* ---- 一个窗口 = 一次渲染的单元 ---- */
.win {
  display: grid;
  overflow: hidden;
  background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-primary);
  border-radius: 10px;
  border: 0.5px solid var(--dsw-alias-border-l3);
  box-shadow: 0 18px 50px rgba(0,0,0,.34), 0 2px 8px rgba(0,0,0,.18);
}
.stage { padding: 26px; display: flex; justify-content: center; align-items: flex-start; }
/* 截图模式：窗口就是画布本身，不留舞台留白、不画圆角与投影，
   否则截出来的图四周会裹一层画布底色。 */
.stage.shot { padding: 0; }
.stage.shot .win { border-radius: 0; border: 0; box-shadow: none; }

/* ---- DSH 侧栏：稿子里只画本插件那一项，其余是外壳示意 ---- */
.side {
  display: flex; flex-direction: column; gap: 10px;
  padding: 12px; min-width: 0; overflow: hidden;
  background: var(--dsw-specific-sidebar-fill);
  border-right: 0.5px solid var(--dsw-alias-border-l3);
}
.sbrand { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 2px; }
.smark {
  width: 20px; height: 20px; flex: none; border-radius: 5px;
  background: var(--dsw-alias-brand-primary); color: var(--dsw-alias-label-primary-inverted);
  display: grid; place-items: center; font-size: 11px; font-weight: 700;
}
.sname { font-size: 13px; font-weight: 600; line-height: 20px; white-space: nowrap; }
.swire {
  border: 1px dashed var(--dsw-alias-border-l3); border-radius: var(--dsw-radius-md);
  padding: 10px; font-size: 11px; line-height: 16px; color: var(--dsw-alias-label-tertiary);
}
.swire i { font-style: normal; color: var(--dsw-alias-label-caption); }
.spanels { display: flex; flex-direction: column; gap: 4px; margin: 0 2px; }
.srow {
  display: flex; align-items: center; gap: 8px;
  min-height: 36px; padding: 7px 8px; border-radius: var(--dsw-radius-md);
  color: var(--dsw-alias-label-primary); font-size: 14px; line-height: 22px; text-align: left;
}
.srow.on { background: var(--dsw-specific-sidebar-nav-item-active); }
.srow svg { flex: none; }
.srow span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sfoot { margin-top: auto; display: flex; gap: 6px; padding: 0 2px; }
.sdot { width: 28px; height: 28px; border-radius: 999px; background: var(--dsw-alias-interactive-bg-hover); }

/* 侧栏收起（宽窗 <1024 时 ui-sidebar 自动收起，稿子用 narrow 档模拟）：
   只留图标，文字整块隐掉。上一版文字照画，被 .side 的 overflow:hidden 切掉
   3px，看着像坏了。 */
.win[data-collapsed] .sname,
.win[data-collapsed] .swire,
.win[data-collapsed] .srow span,
.win[data-collapsed] .sfoot { display: none; }
.win[data-collapsed] .sbrand { justify-content: center; padding: 0; }
.win[data-collapsed] .side { align-items: center; }
/* .spanels 有 margin 0 2px、.srow 有 padding 7px 8px，收起后这一套在 56px 里
   比可用宽多出 3px，正好被 .side 的 overflow:hidden 切一条边。 */
.win[data-collapsed] .spanels { margin: 0; width: 100%; }
.win[data-collapsed] .srow { justify-content: center; padding: 7px; }
.win[data-collapsed] .side { padding: 12px 10px; align-items: center; }
.win[data-collapsed] .smark { width: 24px; height: 24px; }
.win[data-collapsed] .sname,
.win[data-collapsed] .swire,
.win[data-collapsed] .srow span { display: none; }
.win[data-collapsed] .srow { width: 36px; justify-content: center; padding: 7px 0; }
.win[data-collapsed] .sfoot { flex-direction: column; }

/* ---- 面板本体 ---- */
.main { min-width: 0; overflow: hidden; background: var(--dsw-alias-bg-base); display: flex; }
.panel {
  flex: 1 1 auto; min-width: 0; min-height: 0;
  display: flex; flex-direction: column; padding: 18px 20px 16px;
}
.pwrap {
  flex: 1 1 auto; min-height: 0; width: 100%; max-width: 880px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 12px;
  /* 设置这类「一屏塞好几张卡」的屏，窄窗下内容会顶出窗口。
     与其让它被 .main 的 overflow:hidden 切掉 12px，不如让这一层自己滚。
     用 .scroll 的屏内容本来就在 .scroll 里滚，这里不会出现滚动条。 */
  overflow-y: auto;
}
.phead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ptitle { margin: 0; font-size: 20px; line-height: 28px; font-weight: 500; letter-spacing: .01em; }
.psub { margin: -6px 0 0; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); }
.grow { flex: 1 1 auto; }
.badge {
  flex: none; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor;
  font-size: 12px; line-height: 18px; white-space: nowrap;
}
.t-ok { color: var(--dsw-alias-state-success-primary); }
.t-warn { color: var(--dsw-alias-state-warn-primary); }
.t-err { color: var(--dsw-alias-state-error-primary); }
.t-idle { color: var(--dsw-alias-label-tertiary); }

/* 按钮：照 ui-primitives/Button.module.css 的 .sm + variant */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  height: 28px; padding: 0 10px; border-radius: var(--dsw-radius-sm);
  font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-primary);
  white-space: nowrap;
}
.btn.md { height: 36px; padding: 0 14px; border-radius: var(--dsw-radius-md); font-size: 14px; line-height: 22px; }
.btn.primary { background: var(--dsw-alias-button-primary-fill); color: var(--dsw-alias-label-primary-foreground); }
.btn.outline { border: 0.5px solid var(--dsw-alias-border-l3); }
.btn.icon { width: 28px; padding: 0; }
.btn.ghost:hover, .btn.outline:hover { background: var(--dsw-alias-interactive-bg-hover); }
.btn[disabled] { opacity: .4; }

/* 节点条 */
.nodebar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 12px; border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-1); border: 0.5px solid var(--dsw-alias-border-l2);
  font-size: 13px; line-height: 20px;
}
.led { width: 7px; height: 7px; border-radius: 999px; flex: none; background: var(--dsw-alias-state-success-primary); }
.led.off { background: var(--dsw-alias-state-idle-primary); }
.led.warn { background: var(--dsw-alias-state-warn-primary); }
.led.err { background: var(--dsw-alias-state-error-primary); }
.dim { color: var(--dsw-alias-label-tertiary); font-size: 12px; }
.mono { font-family: var(--ds-font-family-code); font-size: 12px; }

/* 搜索框：照 ui-primitives/Input.module.css */
.search {
  display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px;
  border: 0.5px solid var(--dsw-alias-border-l4); border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-1);
}
.search svg { flex: none; color: var(--dsw-alias-label-tertiary); }
.search .ph { flex: 1; min-width: 0; font-size: 14px; line-height: 22px; color: var(--dsw-alias-label-dimmed); text-align: left; }
.search .ph.filled { color: var(--dsw-alias-label-primary); }

/* 过滤条 */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 3px 10px; border-radius: 999px; font-size: 12px; line-height: 18px;
  color: var(--dsw-alias-label-secondary); border: 0.5px solid var(--dsw-alias-border-l3);
}
.chip b { font-weight: 500; color: var(--dsw-alias-label-caption); margin-left: 2px; }
.chip.on { background: var(--dsw-alias-button-ghost-active-fill); border-color: var(--dsw-alias-button-ghost-active-border); color: var(--dsw-alias-label-primary); }
.chip.on b { color: var(--dsw-alias-label-secondary); }

/* 横幅 */
.banner {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 9px 12px; border-radius: var(--dsw-radius-md); font-size: 13px; line-height: 20px;
  background: var(--dsw-alias-state-warn-tertiary); color: var(--dsw-alias-state-warn-label);
}
.banner.info { background: var(--dsw-alias-bg-layer-2); color: var(--dsw-alias-label-secondary); }
.banner.ok { background: var(--dsw-alias-state-success-tertiary); color: var(--dsw-alias-state-success-primary); }
.banner.err { background: var(--dsw-alias-bg-layer-2); color: var(--dsw-alias-state-error-primary); }

/* 滚动区 */
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.rows { display: flex; flex-direction: column; gap: 6px; }

/* 会话行：整行可点，一行一张卡 */
.crow {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 10px 12px; border-radius: var(--dsw-radius-md);
  border: 0.5px solid transparent; background: var(--dsw-alias-bg-layer-1);
}
.crow:hover { background: var(--dsw-alias-interactive-bg-hover-solid); }
.crow[aria-current] { border-color: var(--dsw-alias-button-ghost-active-border); }
.av { position: relative; flex: none; width: 38px; height: 38px; }
.avc {
  width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
  background: var(--dsw-alias-bg-layer-3); color: var(--dsw-alias-label-secondary);
  font-size: 15px; font-weight: 500;

/* ══════════════════════════════════════════════════════════════════════════
   纯函数
   ══════════════════════════════════════════════════════════════════════════ */
function relTime(off) {
  if (!off || off <= 0) return T.never;
  const s = Math.max(0, Math.round(off / SEC));
  if (s < 10) return '刚刚';
  if (s < 60) return s + ' 秒前';
  const m = Math.round(s / 60);
  if (m < 60) return m + ' 分钟前';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' 小时前';
  return Math.round(h / 24) + ' 天前';
}
function uptimeText(ms) {
  const s = Math.floor(ms / SEC), m = Math.floor(s / 60), h = Math.floor(m / 60);
  if (h >= 1) return h + ' 小时 ' + (m % 60) + ' 分';
  return m + ' 分钟';
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* peers × inbox 合成一条会话流。这是本稿唯一的取数动作，字段全部来自
   TidingsPeerView / TidingsMessageView，没有新增来源。 */
function conversations() {
  const seen = {};
  const out = PEERS.map(p => {
    const mine = MSGS.filter(m => m.peerId === p.nodeId);
    seen[p.nodeId] = true;
    return {
      id: p.nodeId, nick: p.nick, host: p.host, platform: p.platform,
      online: p.online, lastSeen: p.lastSeen,
      last: mine[0], count: mine.length,
      unknownPeer: p.nodeId === p.host,
    };
  });
  // 消息里出现过、但邻居表里没有的对端：也得占一行，不然消息就"消失"了
  MSGS.forEach(m => {
    if (seen[m.peerId]) return;
    seen[m.peerId] = true;
    out.push({
      id: m.peerId, nick: '', host: m.peerId, platform: '', online: false,
      lastSeen: 0, last: m, count: MSGS.filter(x => x.peerId === m.peerId).length,
      unknownPeer: true,
    });
  });
  // 排序键：最近一条消息的时间；没有消息的退到 lastSeen。
  out.forEach(c => { c.activity = c.last ? c.last.at : c.lastSeen; });
  out.sort((a, b) => b.activity - a.activity);
  return out;
}
function msgsOf(id) { return MSGS.filter(m => m.peerId === id); }
function preview(c) {
  if (!c.last) return '<span class="l2" style="color:var(--dsw-alias-label-caption)">' + T.msgEmpty + '</span>';
  const d = '<span class="dir">' + (c.last.direction === 'out' ? T.dirOut : T.dirIn) + '</span>';
  const t = c.last.text ? esc(c.last.text) : T.nonText;
  return '<span class="l2">' + d + '<span class="pre">' + t + '</span></span>';
}
function initial(nick) { return nick ? nick.trim().charAt(0) : '?'; }

function chips(active, counts) {
  const defs = [['all', T.chipAll], ['online', T.chipOnline], ['hasmsg', T.chipHasMsg], ['unknown', T.chipUnknown]];
  return '<div class="chips">' + defs.map(d => {

function crow(c, current) {
  const sub = c.nick ? esc(c.nick) : '<span class="cnick unknown">' + T.unknownPeer + '</span>';
  /* 时间只在 l1 里画一次。上一版在行尾另开了一列 `.cmeta` 再画一遍，
     结果是每行右侧两个一模一样的时间。 */
  return '<button class="crow"' + (current ? ' aria-current="true"' : '') + '>'
    + '<span class="av"' + (c.online ? ' data-online=""' : '') + '>'
    + '<span class="avc">' + esc(initial(c.nick)) + '</span>'

    + '<span class="ctime">' + relTime(NOW - c.activity) + '</span></span>'
    + preview(c)
    + '</span>'
    + '</button>';
}
function annot(html) {
  return '<div class="annot"><span class="tag">设计注释</span>' + html + '</div>';

/* ══════════════════════════════════════════════════════════════════════════
   渲染入口
   两种模式：
     · 带 ?screen=…&size=…&theme=…  → 只画那一个窗口，正好是窗口大小（截图用）
     · 否则                          → 控制条 + 画廊
   ══════════════════════════════════════════════════════════════════════════ */
function qs(name) {
  const m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : null;
}
function galleryCell(sid, fid) {
  const f = FORM[fid];
  const k = Math.min(0.30, 1180 / f.w);
  const w = Math.round(f.w * k), h = Math.round(f.h * k);
  const s = SCREENS.filter(x => x.id === sid)[0];
  return '<figure class="gcell" style="width:' + w + 'px">'
    + '<div class="gwin" style="width:' + w + 'px;height:' + h + 'px">'
    + '<div class="gsc" style="width:' + f.w + 'px;height:' + f.h + 'px;transform:scale(' + k + ')">'
    + device(sid, fid) + '</div></div>'
    + '<figcaption>' + s.label + '<i>' + f.label + '</i></figcaption>'
    + '</figure>';
}
function render() {
  const root = document.getElementById('root');
  const sid = qs('screen');
  if (sid) {
    const fid = qs('size') || 'wide-dark';
    const f = FORM[fid] || FORM['wide-dark'];
    const theme = qs('theme');
    const useForm = theme && theme !== f.theme
      ? (FORMS.filter(x => x.theme === theme && x.side === f.side)[0] || f).id
      : fid;
    document.body.style.background = 'transparent';
    const st = document.createElement('div');
    st.className = 'stage shot';
    st.innerHTML = device(sid, useForm);
    root.appendChild(st);
    return;
  }
  const opts = SCREENS.map(s => '<button class="ctlchip" data-screen="' + s.id + '">' + s.label + '</button>').join('');
  const fopts = FORMS.map(f => '<button class="ctlchip" data-form="' + f.id + '">' + f.label + '</button>').join('');
  root.innerHTML =
    '<div class="ctl">'
    + '<div class="ctlrow"><b>形态</b>' + fopts
    + '<span class="ctlhint">侧栏宽度取 columns.ts：280 展开 / 56 收起（视口 &lt;1024 自动收起）</span></div>'
    + '<div class="ctlrow"><b>屏</b>' + opts + '</div>'
    + '</div>'
    + '<div class="gallery" id="g">' + GALLERY.map(g => galleryCell(g[0], g[1])).join('') + '</div>';
  const g = document.getElementById('g');
  g.addEventListener('click', (e) => {
    const cell = e.target.closest('.gcell');
    if (!cell) return;
    const cap = cell.querySelector('figcaption');
    const s = SCREENS.filter(x => x.label === cap.childNodes[0].nodeValue)[0];
    const f = FORMS.filter(x => x.label === cap.querySelector('i').textContent)[0];
    if (s && f) location.search = '?screen=' + s.id + '&size=' + f.id + '&theme=' + f.theme;
  });
}
render();
